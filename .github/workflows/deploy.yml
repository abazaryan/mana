name: Deploy the "moved" page to GitHub Pages

# The app lives on https://mana.amisipehr.workers.dev (Cloudflare Workers Builds, Р32).
# The old address https://abazaryan.github.io/mana/ keeps only a page with a link to it
# (pages-moved/index.html), also served for any other path as 404.html.

on:
  push:
    branches: [main]
    paths:
      - pages-moved/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp pages-moved/index.html pages-moved/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-moved

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
